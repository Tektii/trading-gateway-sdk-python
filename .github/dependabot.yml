version: 2
updates:
  # Python dependencies declared in pyproject.toml and locked in uv.lock.
  # The "uv" ecosystem keeps uv.lock in step; "pip" only edits pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Include transitive dependencies, which exist only in uv.lock — the
    # weekly pip-audit run fails on those as readily as on direct ones.
    allow:
      - dependency-type: "all"
    # A dependency joins the first group it matches, so the runtime
    # dependencies (whose ranges users see) stay in their own PR and
    # everything else — dev tools and transitives — shares a second one.
    groups:
      python-runtime:
        patterns:
          - "httpx"
          - "websockets"
          - "pydantic"
      python-other:
        patterns:
          - "*"

  # GitHub Actions — the supply chain with the largest blast radius.
  # SHA-pinned references are bumped by PR so reviewers see what's changing.
  # All action bumps land in one weekly PR rather than one PR per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
