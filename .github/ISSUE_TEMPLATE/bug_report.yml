name: Bug report
description: Something is broken in the SDK
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        Please **do not** use this template for security vulnerabilities —
        see [SECURITY.md](../../SECURITY.md) for the private reporting
        process.

  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: Run `python -c "import tektii_gateway; print(tektii_gateway.__version__)"`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true

  - type: input
    id: gateway-version
    attributes:
      label: Gateway version
      description: Which version of the Tektii Trading Gateway are you running against? ("mock" / "alpaca" / a specific commit is fine)
      placeholder: "ghcr.io/tektii/gateway:latest (mock provider)"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, what you expected, and what you actually saw.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code snippet that reproduces the bug, plus how to run it. Please remove any secrets before pasting.
      render: python
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Full traceback / logs
      description: If applicable, paste the full traceback here.
      render: shell
    validations:
      required: false
