name: audit

# Weekly dependency CVE scan using pip-audit. Runs on a schedule so a CVE
# published after our last commit still gets caught even if no PR is open.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pip-audit
        run: uv run --with pip-audit pip-audit --strict
