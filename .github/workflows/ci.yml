name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege by default. Individual jobs can elevate as needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/

      - name: Type check (mypy)
        run: uv run mypy src/

      - name: Test (pytest + coverage)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  openapi-drift:
    name: openapi drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check generated models match gateway OpenAPI spec
        run: ./scripts/generate.sh --check

  build:
    name: build distribution
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Build wheel + sdist
        run: uv build

      - name: Verify wheel metadata
        run: uv run --with twine twine check dist/*

      - name: Verify py.typed is packaged
        run: |
          set -euo pipefail
          unzip -l dist/*.whl | grep -q 'tektii/py\.typed$'

      - name: Verify sdist has no dev artefacts
        run: |
          set -euo pipefail
          # If any of these patterns appear in the sdist the build config is
          # broken — fail loudly rather than publish dev caches to PyPI.
          if tar -tzf dist/*.tar.gz | grep -E '(^|/)(\.coverage|\.mypy_cache|\.pytest_cache|\.ruff_cache|\.venv|\.env($|\.))'; then
            echo "::error::sdist contains dev artefacts — check pyproject.toml [tool.hatch.build.targets.sdist] exclude list"
            exit 1
          fi

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
