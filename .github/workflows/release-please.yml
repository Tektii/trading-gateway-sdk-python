name: Release Please

on:
  push:
    branches: [main]

# Maintains a perpetually-open "Release PR" that bumps src/tektii/_version.py
# and updates CHANGELOG.md from the Conventional Commits accumulated since the
# last release. Merging the Release PR pushes a `vX.Y.Z` tag, which triggers
# release.yml to build and publish tektii to PyPI.
#
# Authenticates as an org-owned GitHub App ("Tektii Release Bot") rather than
# GITHUB_TOKEN. The Tektii org enforces "Actions cannot create or approve pull
# requests" at org level, which the default GITHUB_TOKEN inherits; an App
# installation token is a separate identity not bound by that toggle, so
# release-please can open its Release PR. The App is granted only
# Contents: write + Pull requests: write, and create-github-app-token mints a
# short-lived token scoped to this repo on each run — no long-lived credential
# is stored. Using the App identity (not GITHUB_TOKEN) also lets the release
# tag it creates trigger release.yml's publish job.
#
# Required config (both org secrets): RELEASE_BOT_APP_ID (the App's numeric ID)
# and RELEASE_BOT_APP_KEY (the App's PEM private key).

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions: {} # Auth is via the App token, not GITHUB_TOKEN
    steps:
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
