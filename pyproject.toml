[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tektii"
dynamic = ["version"]
description = "Python SDK for the Tektii Trading Gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tektii", email = "hello@tektii.com" }]
keywords = [
    "trading",
    "gateway",
    "backtesting",
    "algorithmic-trading",
    "tektii",
    "quant",
    "websocket",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    # Pinned away from the legacy websockets client. websockets 14 is the
    # first release where the asyncio.client API that we use is the default
    # supported shape; avoiding <14 prevents import-path churn on upgrade.
    "websockets>=14,<15",
    "pydantic>=2.5,<3",
]

[project.urls]
Homepage = "https://github.com/Tektii/trading-gateway-sdk-python"
Repository = "https://github.com/Tektii/trading-gateway-sdk-python"
Documentation = "https://github.com/Tektii/trading-gateway-sdk-python#readme"
Changelog = "https://github.com/Tektii/trading-gateway-sdk-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/Tektii/trading-gateway-sdk-python/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.8",
    "datamodel-code-generator>=0.25",
]

[tool.hatch.version]
path = "src/tektii/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tektii"]
# PEP 561 marker — ensures downstream type checkers recognize this package
# as typed even though the file is empty.
include = ["src/tektii/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "src/tektii",
    "tests",
    "examples",
    "scripts",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
# Belt-and-braces: the hatchling default already respects .gitignore, but for
# a financial-infrastructure SDK it is worth being explicit about what can
# never leak into a published sdist.
exclude = [
    ".coverage",
    ".coverage.*",
    "coverage.xml",
    "htmlcov",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".env",
    ".env.*",
    "**/__pycache__",
    "*.pyc",
]

[tool.datamodel-codegen]
# ``input`` is passed explicitly by ``scripts/generate.sh`` — the script fetches
# the OpenAPI spec from the public trading-gateway repo (or a path via
# $OPENAPI_SPEC) and hands the resolved location to datamodel-codegen.
output = "src/tektii/_generated/models.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.11"
use-standard-collections = true
use-union-operator = true
field-constraints = true
capitalise-enum-members = true
# NOTE: we intentionally do NOT set ``use-decimal`` — the gateway serialises
# all financial values as strings on the wire (matching Rust's rust_decimal)
# and the SDK keeps them that way end-to-end for precision safety.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# The generated models file is owned by datamodel-code-generator. We should
# never hand-format it — regenerate it instead.
exclude = ["src/tektii/_generated/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PL", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/tektii/_generated/*" = ["E501", "PLR0911", "PLR0912", "PLR0913"]
"src/tektii/async_client.py" = ["PLR0913", "PLC0415"]
"src/tektii/client.py" = ["PLR0913", "PLC0415"]
"src/tektii/stream.py" = ["PLR0912", "PLR0913"]
"tests/*" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
markers = ["integration: requires running gateway"]

[tool.coverage.run]
source = ["src/tektii"]
branch = true
omit = [
    "src/tektii/_generated/*",
    "src/tektii/_version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false
precision = 1
